name: Agent week native UI

permissions:
  contents: write

on:
  push:
    branches:
      - feature/agent-week-plan
  workflow_dispatch:

jobs:
  card-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install native display dependencies
        id: deps
        run: |
          set -o pipefail
          mkdir -p .local-state/ci-logs
          {
            sudo apt-get update
            sudo apt-get install -y xvfb libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev libudev-dev libwayland-dev libpulse-dev libdrm-dev libxkbcommon-dev
          } 2>&1 | tee .local-state/ci-logs/deps.log

      - name: Prepare pinned OctoSense runtime
        id: runtime
        run: |
          set -o pipefail
          {
            mkdir -p ../octosense-ws
            git clone --filter=blob:none https://github.com/OctoSense-org/OctoScript-App-Design-Flow.git ../octosense-ws/OctoScript-App-Design-Flow
            git -C ../octosense-ws/OctoScript-App-Design-Flow checkout 7ddf8a16ab30bf8e095d55e5ceebe0478c1a8386
            git clone --filter=blob:none https://github.com/OctoSense-org/OctoSense-App-Hub.git ../octosense-ws/OctoSense-App-Hub
            git -C ../octosense-ws/OctoSense-App-Hub checkout 46d67e51b62827a1224b1aacddc2a7b9e69185fc
            python3 ../octosense-ws/OctoScript-App-Design-Flow/tools/setup-native.py
            python3 ../octosense-ws/OctoScript-App-Design-Flow/tools/setup-native.py --check
          } 2>&1 | tee .local-state/ci-logs/runtime.log

      - name: Build card-host and Hub CLI
        id: build
        run: |
          set -o pipefail
          (cd ../octosense-ws/OctoSense-App-Hub && cargo build --release -p octosense-card-host -p octosense-app-hub) 2>&1 | tee .local-state/ci-logs/build.log

      - name: Rebuild and check bundle
        id: bundle
        run: |
          set -o pipefail
          {
            python3 scripts/build-octos-bundle.py
            ../octosense-ws/OctoScript-App-Design-Flow/tools/octo check bundle
          } 2>&1 | tee .local-state/ci-logs/bundle.log

      - name: Exercise native seven-day draft
        id: week
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1200x24' python3 scripts/test-week-draft.py 2>&1 | tee .local-state/ci-logs/week.log

      - name: Exercise native basic interactions
        id: basic
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1200x24' python3 scripts/test-basic-app.py 2>&1 | tee .local-state/ci-logs/basic.log

      - name: Retain genuine test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-week-native-captures
          path: |
            .local-state/week-*/draft.png
            .local-state/week-*/confirmed.png
          if-no-files-found: ignore

      - name: Publish a key-free run verdict
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '{"source_commit":"%s","result":"%s","run":"%s"}\n' \
            '${{ github.sha }}' '${{ job.status }}' '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > ci-result.json
          printf 'deps=%s\nruntime=%s\nbuild=%s\nbundle=%s\nweek=%s\nbasic=%s\n' \
            '${{ steps.deps.outcome }}' '${{ steps.runtime.outcome }}' '${{ steps.build.outcome }}' \
            '${{ steps.bundle.outcome }}' '${{ steps.week.outcome }}' '${{ steps.basic.outcome }}' \
            > ci-steps.txt
          mkdir -p ci-logs
          for file in .local-state/ci-logs/*.log; do
            if [ -f "$file" ]; then tail -n 80 "$file" > "ci-logs/$(basename "$file" .log).txt"; fi
          done
          git add ci-result.json ci-steps.txt ci-logs
          git commit -m "Record native UI run ${{ github.run_id }}"
          git push origin HEAD:refs/heads/ci-results/${{ github.run_id }}
